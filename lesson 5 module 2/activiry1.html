<doctype>
    <html>
        <head>
            <title>my animal fact file</title>
            <style>
                body{
                    background-color: azure;
                    font-family: Arial, Helvetica, sans-serif;
                }
                .factfile{
                    background-color: aquamarine;
                    color: rgb(170, 34, 34);
                    width: 260px;
                    padding: 25px;
                    border: 4px solid black;
                    margin: 30px;
                }
                .animalname{
                    color: cadetblue;
                    font-size: 22px;
                }
                .details{
                    color: blueviolet;
                }
                .coolfact{
                    color: bisque;
                    font-style: italic;
                }
            </style>
            </head>
            <body>
            <div class="factfile">
                <h2 class="animal name">snow leapord</h2>
                <p class="details">type: big cat</p>
                <p class="details">live in: mountains</p>
                <p class="details">diet:deer,goat,wild sheep</p>
                <p class="details">coolfacts:can leap 15 metres in one jump</p>
                </div>
                </body>
                </html>
