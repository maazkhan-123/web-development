<doctype>
    <html>
        <head>
            <title>my doctor appoimtment</title>
            </head>
            <body>
                <h1>my doctor appointmet form </h1>
                <p>fill in the form bolw to book appointment</p>
                <form>
                    <fieldset>
                        <legend>personal information</legend>
                        <label>your name</label><br>
                        <input type="text" id="name" placeholder="enter your full name"><br><br>
                        <label>your passwor</label><br>
                        <input type="password" id="pid" placeholder="enter your password"><br><br>
                        <label>date of birth</label><br>
                        <input type="date" id="dob"><br><br>
                        </fieldset>
                        <fieldset>
                            <legend>your visit</legend>
                            <label>choose your doctor</label><br><br>
                            <select id="doctor">
                                <option value="dr.maaz">Dr maaz</option>
                                <option value="dr.saleem">Dr saleem</option>
                                <option value="dr.maham">Dr maham</option>    
                            </select><br><br>
                            <label>why are you visiting</label><br>
                            <input type="radio" name="reason" value="fever"> Fever<br>
                            <input type="radio" name="reason" value="cold"> cold<br>
                            <input type="radio" name="reason" value="vomiting"> vomiting<br><br>
                            <label>any notes for the doctor</label><br>
                            <textarea id="notes" pplaceholder="write your notes"><br>
                                </textarea>

                            </fieldset>
                            <fieldset> 
                            <legend>prefered visit day</legend>
                            <input type="checkbox" value="monday">monday<br>
                            <input type="checkbox" value="tuesday">tuesday<br>
                            <input type="checkbox" value="friday">friday<br>
                            </fieldset><br>
                            <input type="submit" value="book my appointment">
                            </form>
                            </body>
                            </html>
